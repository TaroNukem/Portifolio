<!DOCTYPE html>
<html lang="pt-BR" th:lang="${#locale.toLanguageTag()}" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="#{page.title}">TaroNukem's Portfolio</title>
    <link rel="icon" type="image/x-icon" th:href="@{/images/favicon.ico}">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body>

<div class="top-bar">
    <h1><a href="#profile">TaroNukem's Portfolio</a></h1>
    <a href="#profile" th:text="#{menu.profile}"></a>
    <a href="#projects" th:text="#{menu.projects}"></a>
    <a href="#experiences" th:text="#{menu.experiences}"></a>
    <a href="#skills" th:text="#{menu.skills}"></a>
    <a href="#contact" th:text="#{menu.contact}"></a>

    <div class="profile-menu">
        <button class="profile-menu-button" id="profileMenuButton" type="button" aria-expanded="false"
                aria-controls="profileDropdown">
            <i class="fa-solid fa-user-gear"></i>
            <span th:text="#{menu.options}"></span>
            <i class="fa-solid fa-chevron-down menu-arrow"></i>
        </button>

        <div class="profile-dropdown" id="profileDropdown" hidden>
            <a href="https://github.com/TaroNukem/Portifolio" target="_blank" rel="noopener noreferrer"
               class="dropdown-item">
                <i class="fa-solid fa-code"></i>
                <span th:text="#{menu.projectDetails}"></span>
                <i class="fa-solid fa-arrow-up-right-from-square external-icon"></i>
            </a>

            <div class="dropdown-section">
                <button type="button" class="dropdown-item dropdown-toggle" id="languageMenuButton"
                        aria-expanded="false" aria-controls="languageSubmenu">
                    <i class="fa-solid fa-globe"></i>
                    <span th:text="#{menu.changeLanguage}"></span>
                    <i class="fa-solid fa-chevron-right submenu-arrow"></i>
                </button>

                <div class="language-submenu" id="languageSubmenu" hidden>
                    <a class="dropdown-item language-option" th:classappend="${#locale.language == 'pt'} ? 'active'"
                       th:href="@{/(lang='pt-BR')}">
                        <span>🇧🇷</span><span>Português</span><i class="fa-solid fa-check language-check"></i>
                    </a>
                    <a class="dropdown-item language-option" th:classappend="${#locale.language == 'en'} ? 'active'"
                       th:href="@{/(lang='en')}">
                        <span>🇺🇸</span><span>English</span><i class="fa-solid fa-check language-check"></i>
                    </a>
                </div>
            </div>

            <div class="dropdown-divider"></div>

            <button type="button" class="dropdown-item" id="openPixButton">
                <i class="fa-solid fa-qrcode"></i>
                <span th:text="#{menu.pix}"></span>
            </button>
        </div>
    </div>
</div>

<div class="pix-modal" id="pixModal" hidden>
    <div class="pix-modal-content" role="dialog" aria-modal="true" aria-labelledby="pixModalTitle">
        <button type="button" class="pix-close-button" id="closePixButton" th:aria-label="#{pix.close}">
            <i class="fa-solid fa-xmark"></i>
        </button>
        <i class="fa-solid fa-qrcode pix-title-icon"></i>
        <h2 id="pixModalTitle" th:text="#{menu.pix}"></h2>
        <p th:text="#{pix.description}"></p>
        <img th:src="@{/images/qrcode-pix.png}" th:alt="#{pix.qrAlt}" class="pix-qr-code">
    </div>
</div>

<video class="video-background" autoplay muted loop playsinline>
    <source th:src="@{/videos/fundo.mp4}" type="video/mp4">
</video>

<div class="fundo-escuro"></div>

<div class="perfil">

    <div class="esquerda">

        <div class="card bio-foto" id="profile">
            <div class="avatar-frame">
                <span class="splash-text" th:text="${frase}"></span>
                <img class="avatar-photo" th:src="@{/images/fotoPerfil.gif}" th:alt="#{profile.photo.alt}">
                <img class="avatar-frame-overlay" th:src="@{/images/moldura.png}" alt="" aria-hidden="true">
            </div>

            <div class="info">
                <h1>Daniel Rolando</h1>
                <h3 th:text="#{profile.tagline}"></h3>
                <h5>
                    <i class="fa-solid fa-location-dot"></i>
                    <span th:text="#{profile.location}"></span>
                </h5>
                <p th:text="#{profile.bio}"></p>
            </div>
        </div>

        <div class="card projetos" id="projects">
            <h2>
                <i class="fa-solid fa-folder-open"></i>
                <span th:text="#{projects.heading}"></span>
            </h2>

            <div class="project-grid">

                <article class="project-card">
                    <div class="project-preview">
                        <img th:src="@{/images/biblioteca-jogos.png}" th:alt="#{projects.games.imageAlt}"
                             loading="lazy">
                    </div>
                    <div class="project-content">
                        <h3 th:text="#{projects.games.title}"></h3>
                        <p th:text="#{projects.games.description}"></p>
                        <div class="project-technologies">
                            <span>Java</span><span>Spring Boot</span><span>HTML</span><span>CSS</span><span>JavaScript</span>
                        </div>
                        <div class="project-actions">
                            <a href="https://github.com/TaroNukem/Biblioteca-de-Jogos" target="_blank"
                               rel="noopener noreferrer" class="project-button">
                                <i class="fa-brands fa-github"></i>
                                <span th:text="#{projects.code}"></span>
                            </a>
                        </div>
                    </div>
                    <div class="project-footer">
                        <i class="fa-regular fa-calendar"></i>
                        <span th:text="#{projects.games.date}"></span>
                    </div>
                </article>

                <article class="project-card">
                    <div class="project-preview">
                        <img th:src="@{/images/portfolio.png}" th:alt="#{projects.portfolio.imageAlt}"
                             loading="lazy">
                    </div>
                    <div class="project-content">
                        <h3 th:text="#{projects.portfolio.title}"></h3>
                        <p th:text="#{projects.portfolio.description}"></p>
                        <div class="project-technologies">
                            <span>Java</span><span>Spring Boot</span><span>Thymeleaf</span><span>HTML</span><span>CSS</span>
                        </div>
                        <div class="project-actions">
                            <a href="https://github.com/TaroNukem/Portifolio" target="_blank"
                               rel="noopener noreferrer" class="project-button">
                                <i class="fa-brands fa-github"></i>
                                <span th:text="#{projects.code}"></span>
                            </a>
                        </div>
                    </div>
                    <div class="project-footer">
                        <i class="fa-regular fa-calendar"></i>
                        <span th:text="#{projects.portfolio.date}"></span>
                    </div>
                </article>

            </div>
        </div>

        <div class="card experiencias" id="experiences">
            <h2>
                <i class="fa-solid fa-briefcase"></i>
                <span th:text="#{experiences.heading}"></span>
            </h2>

            <div class="timeline">

                <div class="timeline-item">
                    <span class="timeline-date" th:text="#{experiences.tech.period}"></span>
                    <article class="experience-card">
                        <h3 th:text="#{experiences.tech.role}"></h3>
                        <h4 th:text="#{experiences.tech.place}"></h4>
                        <p th:text="#{experiences.tech.description}"></p>
                    </article>
                </div>

                <div class="timeline-item">
                    <span class="timeline-date" th:text="#{experiences.puc.period}"></span>
                    <article class="experience-card">
                        <h3 th:text="#{experiences.puc.role}"></h3>
                        <h4 th:text="#{experiences.puc.place}"></h4>
                        <p th:text="#{experiences.puc.description}"></p>
                    </article>
                </div>

                <div class="timeline-item">
                    <span class="timeline-date" th:text="#{experiences.personal.period}"></span>
                    <article class="experience-card">
                        <h3 th:text="#{experiences.personal.role}"></h3>
                        <h4 th:text="#{experiences.personal.place}"></h4>
                        <p th:text="#{experiences.personal.description}"></p>
                    </article>
                </div>

            </div>
        </div>

        <div class="card skills" id="skills">
            <h2>
                <i class="fa-solid fa-code"></i>
                <span th:text="#{skills.heading}"></span>
            </h2>

            <div class="skill-category">
                <h3 th:text="#{skills.languages}"></h3>
                <div class="skill-tags">
                    <span>Java</span><span>Spring Boot</span><span>Python</span><span>HTML5</span><span>CSS3</span>
                </div>
            </div>

            <div class="skill-category">
                <h3 th:text="#{skills.tools}"></h3>
                <div class="skill-tags">
                    <span>Git</span><span>VS Code</span><span>IntelliJ IDEA</span><span>PyCharm</span>
                </div>
            </div>
        </div>

        <div class="card languages">
            <h2 class="activity-header">
                <span class="activity-title">
                    <i class="fa-solid fa-code"></i>
                    <span th:text="#{languages.heading}"></span>
                </span>
                <span class="activity-total" th:text="#{languages.total(${waka.total})}"></span>
            </h2>

            <div class="activity-list">
                <article class="activity-item" th:each="lang : ${waka.linguagens}">
                    <div class="activity-main">
                        <div class="activity-banner" th:classappend="${lang.slug}">
                            <i th:class="${lang.icone}"></i>
                        </div>
                        <div class="activity-info">
                            <h3 th:text="${lang.nome}"></h3>
                            <div class="activity-time" th:text="${lang.tempo}"></div>
                        </div>
                    </div>
                    <div class="activity-progress">
                        <div class="activity-progress-top">
                            <span th:text="#{languages.share}"></span>
                            <span th:text="${lang.percentual} + '%'"></span>
                        </div>
                        <div class="activity-bar">
                            <div class="activity-bar-fill" th:style="|width: ${lang.percentual}%|"></div>
                        </div>
                    </div>
                </article>
                <p class="activity-empty" th:if="${waka.linguagens.isEmpty()}" th:text="#{languages.empty}"></p>
            </div>
        </div>

    </div>

    <div class="direita">

        <div class="card developer">
            <div class="logoPUC">
                <img th:src="@{/images/pucMinas.png}" alt="PUC Minas">
            </div>
            <h1 th:text="#{education.semester}"></h1>
            <p th:text="#{education.description}"></p>
        </div>

        <div class="card stats">
            <h2 th:text="#{github.heading}"></h2>

            <div class="stat">
                <span>
                    <i class="fa-solid fa-book-bookmark"></i>
                    <span th:text="#{github.repositories}"></span>
                </span>
                <strong th:text="${github.public_repos} ?: 0">0</strong>
            </div>

            <div class="stat">
                <span>
                    <i class="fa-solid fa-code-commit"></i>
                    <span th:text="#{github.commits}"></span>
                </span>
                <strong th:text="${github.total_commits} ?: 0">0</strong>
            </div>

            <div class="stat">
                <span>
                    <i class="fa-solid fa-users"></i>
                    <span th:text="#{github.followers}"></span>
                </span>
                <strong th:text="${github.followers} ?: 0">0</strong>
            </div>

            <div class="stat">
                <span>
                    <i class="fa-solid fa-code"></i>
                    <span th:text="#{github.topLanguages}"></span>
                </span>
            </div>


            <div class="top-languages">
                <a href="https://github.com/TaroNukem"
                   target="_blank"
                   rel="noopener noreferrer">
                    <img
                            src="https://github-readme-stats.vercel.app/api/top-langs/?username=TaroNukem&layout=pie&stats_format=percentages&theme=dark&hide_border=true&border_radius=5&card_width=466&locale=pt-br&hide_title=true&langs_count=10&size_weight=1"
                            alt="Gráfico das linguagens mais utilizadas no GitHub"
                            loading="lazy"
                            onerror="this.style.display='none';">
                </a>
            </div>

        </div>

        <div class="card contato" id="contact">
            <h2 th:text="#{contact.heading}"></h2>

            <div class="contato-followers">
                <i class="fa-solid fa-users contato-followers-icon"></i>
                <strong th:text="${github.followers} ?: 0">0</strong>
                <span th:text="#{contact.githubFollowers}"></span>
            </div>

            <div class="contato-links">
                <a href="https://github.com/TaroNukem" target="_blank" rel="noopener noreferrer" class="contato-botao">
                    <i class="fa-brands fa-github"></i> GitHub
                </a>
                <a href="https://www.linkedin.com/in/daniel-rolando-22061137a" target="_blank" rel="noopener noreferrer"
                   class="contato-botao">
                    <i class="fa-brands fa-linkedin"></i> LinkedIn
                </a>
                <a href="mailto:danielgomesrolando@gmail.com" class="contato-botao">
                    <i class="fa-solid fa-envelope"></i> Email
                </a>
                <a th:href="@{/files/curriculo.pdf}" target="_blank" rel="noopener noreferrer" class="contato-botao">
                    <i class="fa-solid fa-file-lines"></i>
                    <span th:text="#{contact.resume}"></span>
                </a>
            </div>

            <div class="contato-info">
                <p>
                    <i class="fa-solid fa-envelope"></i>
                    <strong th:text="#{contact.email}"></strong>
                    <a href="mailto:danielgomesrolando@gmail.com">danielgomesrolando@gmail.com</a>
                </p>
                <p>
                    <i class="fa-solid fa-phone"></i>
                    <strong th:text="#{contact.phone}"></strong>
                    <span>(+55) 31 98539-5309</span>
                </p>
                <p>
                    <i class="fa-solid fa-location-dot"></i>
                    <strong th:text="#{contact.location}"></strong>
                    <span th:text="#{contact.city}"></span>
                </p>
            </div>
        </div>

    </div>

</div>

<footer class="footer">

    <div class="footer-main">

        <div class="footer-column">
            <h3 th:text="#{footer.quickLinks}"></h3>
            <a href="#profile" th:text="#{menu.profile}"></a>
            <a href="#projects" th:text="#{menu.projects}"></a>
            <a href="#experiences" th:text="#{menu.experiences}"></a>
            <a href="#contact" th:text="#{menu.contact}"></a>
            <a href="#skills" th:text="#{menu.skills}"></a>
        </div>

        <div class="footer-column">
            <h3 th:text="#{footer.connect}"></h3>
            <div class="footer-socials">
                <a href="https://github.com/TaroNukem" target="_blank" rel="noopener noreferrer" aria-label="GitHub"><i
                        class="fa-brands fa-github"></i></a>
                <a href="https://www.linkedin.com/in/daniel-rolando-22061137a" target="_blank" rel="noopener noreferrer"
                   aria-label="LinkedIn"><i class="fa-brands fa-linkedin"></i></a>
                <a href="mailto:danielgomesrolando@gmail.com" aria-label="Email"><i class="fa-regular fa-envelope"></i></a>
            </div>
        </div>

        <div class="footer-column footer-about">
            <h3 th:text="#{footer.about}"></h3>
            <p th:text="#{footer.description}"></p>
        </div>

    </div>

    <div class="footer-bottom">
        <div class="footer-bottom-content">
            <span th:text="#{footer.copyright}"></span>
            <span th:text="#{footer.inspiration}"></span>
        </div>
    </div>

</footer>

<script>
    const profileMenuButton = document.getElementById('profileMenuButton');
    const profileDropdown = document.getElementById('profileDropdown');
    const languageMenuButton = document.getElementById('languageMenuButton');
    const languageSubmenu = document.getElementById('languageSubmenu');
    const openPixButton = document.getElementById('openPixButton');
    const pixModal = document.getElementById('pixModal');
    const closePixButton = document.getElementById('closePixButton');

    function closeLanguageMenu() {
        languageSubmenu.hidden = true;
        languageMenuButton.setAttribute('aria-expanded', 'false');
    }

    function closeProfileMenu() {
        profileDropdown.hidden = true;
        profileMenuButton.setAttribute('aria-expanded', 'false');
        closeLanguageMenu();
    }

    function closePixModal() {
        pixModal.hidden = true;
        openPixButton.focus();
    }

    profileMenuButton.addEventListener('click', () => {
        if (profileDropdown.hidden) {
            profileDropdown.hidden = false;
            profileMenuButton.setAttribute('aria-expanded', 'true');
        } else {
            closeProfileMenu();
        }
    });

    languageMenuButton.addEventListener('click', () => {
        const isOpen = !languageSubmenu.hidden;
        languageSubmenu.hidden = isOpen;
        languageMenuButton.setAttribute('aria-expanded', String(!isOpen));
    });

    openPixButton.addEventListener('click', () => {
        pixModal.hidden = false;
        closeProfileMenu();
        closePixButton.focus();
    });

    closePixButton.addEventListener('click', closePixModal);

    pixModal.addEventListener('click', event => {
        if (event.target === pixModal) closePixModal();
    });

    document.addEventListener('click', event => {
        if (!event.target.closest('.profile-menu')) closeProfileMenu();
    });

    document.addEventListener('keydown', event => {
        if (event.key === 'Escape') {
            closeProfileMenu();
            if (!pixModal.hidden) closePixModal();
        }
    });

    // ===== Troca de idioma sem recarregar a página =====
    function syncTexts(current, next) {
        if (current.nodeType !== Node.ELEMENT_NODE) return;
        if (current.tagName === 'SCRIPT' || current.tagName === 'VIDEO') return;

        ['alt', 'aria-label', 'title'].forEach(attr => {
            if (next.hasAttribute(attr) && current.getAttribute(attr) !== next.getAttribute(attr)) {
                current.setAttribute(attr, next.getAttribute(attr));
            }
        });

        if (current.classList.contains('language-option')) {
            current.className = next.className;
        }

        const currentNodes = current.childNodes;
        const nextNodes = next.childNodes;
        if (currentNodes.length !== nextNodes.length) return;

        for (let i = 0; i < currentNodes.length; i++) {
            const a = currentNodes[i];
            const b = nextNodes[i];
            if (a.nodeType === Node.TEXT_NODE && b.nodeType === Node.TEXT_NODE) {
                if (a.nodeValue !== b.nodeValue) a.nodeValue = b.nodeValue;
            } else {
                syncTexts(a, b);
            }
        }
    }

    async function switchLanguage(url) {
        const response = await fetch(url, {credentials: 'same-origin'});
        if (!response.ok) throw new Error('Falha ao trocar idioma');

        const html = await response.text();
        const newDoc = new DOMParser().parseFromString(html, 'text/html');

        document.documentElement.lang = newDoc.documentElement.lang;
        document.title = newDoc.title;
        syncTexts(document.body, newDoc.body);
    }

    document.querySelectorAll('.language-option').forEach(link => {
        link.addEventListener('click', async event => {
            event.preventDefault();
            const url = link.href;
            try {
                await switchLanguage(url);
                closeProfileMenu();
            } catch (error) {
                window.location.href = url;
            }
        });
    });

</script>

</body>
</html>
