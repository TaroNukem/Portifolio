profile.bio=Sou estudante de Engenharia de Software e estou no começo da minha jornada como desenvolvedor. Gosto de aprender coisas novas, criar projetos e entender melhor como as tecnologias funcionam. Fora da programação, curto jogos, música e basquete. Gosto bastante de Metal Gear, o Kojima é um gênio e recentemente comecei a aprender violão.

